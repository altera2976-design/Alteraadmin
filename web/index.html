<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!--
      Permissive CSP for development — allows Expo Metro bundler scripts.
      In production builds, tighten this to match your hosting environment.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src * 'self' data: blob:; script-src * 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; style-src * 'self' 'unsafe-inline'; img-src * 'self' data: blob:; font-src * 'self' data:; connect-src * 'self' ws: wss:; worker-src blob:;"
    />

    <title>Altera Interior EMS</title>
    <meta name="description" content="Altera Interior — Employee & Business Management System" />

    <!-- App theme colour for browser chrome -->
    <meta name="theme-color" content="#D60000" />

    <!-- Disable phone number detection on iOS Safari -->
    <meta name="format-detection" content="telephone=no" />

    <style>
      /* Prevent FOUC */
      html, body, #root { height: 100%; margin: 0; padding: 0; background-color: #F7F7F7; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
